<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CL vs BRENTOIL 价差</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    body { margin: 0; font-family: Inter, Arial, sans-serif; background: #0b1020; color: #e5e7eb; }
    .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .sub { color: #94a3b8; margin-bottom: 16px; line-height: 1.6; }
    .toolbar { display: flex; gap: 10px; margin: 12px 0 16px; flex-wrap: wrap; }
    .toolbar button {
      cursor: pointer; border: 1px solid #334155; border-radius: 999px; padding: 8px 16px;
      color: #cbd5e1; background: #0f172a; font-size: 14px;
    }
    .toolbar button.active { color: #082f49; background: #7dd3fc; border-color: #7dd3fc; font-weight: 700; }
    #chart { width: 100%; height: 720px; background: #111827; border-radius: 16px; }
    .meta { margin: 14px 0 18px; color: #cbd5e1; font-size: 14px; line-height: 1.7; }
    .note { margin-top: 12px; color: #94a3b8; font-size: 13px; }
    a { color: #7dd3fc; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>CL vs BRENTOIL 价差</h1>
    <div class="sub">
      数据来自 Hyperliquid <code>xyz</code> 市场。可切换<strong>小时级</strong>和<strong>日线</strong>数据。
      上图显示 <code>xyz:CL</code> 与 <code>xyz:BRENTOIL</code> 收盘价，下图显示绝对价差（BRENTOIL - CL）。悬停时会同时显示价格、绝对价差和相对价差。
    </div>
    <div class="toolbar">
      <button id="btn-hourly" class="active" type="button">小时线</button>
      <button id="btn-daily" type="button">日线</button>
    </div>
    <div id="meta" class="meta">正在加载数据…</div>
    <div id="chart"></div>
    <div class="note">更新数据后刷新页面即可看到最新图表。小时线读取 <code>data_hourly.json</code>，日线读取 <code>data_daily.json</code>。</div>
  </div>

  <script>
    const datasets = {
      hourly: { label: '小时线', file: './data_hourly.json', buttonId: 'btn-hourly' },
      daily: { label: '日线', file: './data_daily.json', buttonId: 'btn-daily' }
    };

    const chart = echarts.init(document.getElementById('chart'));

    function setActive(kind) {
      for (const [key, cfg] of Object.entries(datasets)) {
        document.getElementById(cfg.buttonId).classList.toggle('active', key === kind);
      }
    }

    async function loadData(kind) {
      const cfg = datasets[kind];
      setActive(kind);
      document.getElementById('meta').textContent = `正在加载${cfg.label}数据…`;

      const res = await fetch(cfg.file, { cache: 'no-store' });
      if (!res.ok) throw new Error(`${cfg.file} HTTP ${res.status}`);

      const data = await res.json();
      const { meta, series } = data;
      const buckets = series.buckets ?? series.dates;

      document.getElementById('meta').innerHTML = [
        `当前：${cfg.label}`,
        `数据源：${meta.source}（dex=${meta.dex}）`,
        `更新时间：${meta.updated_at}`,
        `周期：${meta.interval}`,
        `CL 条数：${meta.counts.cl_bars ?? meta.counts.cl_days}`,
        `BRENTOIL 条数：${meta.counts.bren_bars ?? meta.counts.bren_days}`,
        `重叠条数：${meta.counts.overlap_bars ?? meta.counts.overlap_days}`
      ].join(' ｜ ');

      chart.setOption({
        backgroundColor: '#111827',
        animation: false,
        color: ['#38bdf8', '#f59e0b', '#22c55e', '#a78bfa'],
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'cross' },
          backgroundColor: 'rgba(15,23,42,0.95)',
          borderColor: '#334155',
          textStyle: { color: '#e5e7eb' },
          formatter: (params) => {
            const i = params[0].dataIndex;
            return [
              `<b>${buckets[i]}</b>`,
              `CL：${Number(series.cl_close[i]).toFixed(3)}`,
              `BRENTOIL：${Number(series.bren_close[i]).toFixed(3)}`,
              `绝对价差：${Number(series.spread_abs_bren_minus_cl[i]).toFixed(3)}`,
              `相对价差：${(Number(series.spread_pct_vs_cl[i]) * 100).toFixed(2)}%`
            ].join('<br/>');
          }
        },
        legend: { top: 10, textStyle: { color: '#cbd5e1' } },
        grid: [
          { left: 70, right: 30, top: 60, height: 300 },
          { left: 70, right: 30, top: 430, height: 180 }
        ],
        xAxis: [
          { type: 'category', boundaryGap: false, data: buckets, axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' } },
          { type: 'category', boundaryGap: false, gridIndex: 1, data: buckets, axisLine: { lineStyle: { color: '#475569' } }, axisLabel: { color: '#94a3b8' } }
        ],
        yAxis: [
          { type: 'value', scale: true, axisLine: { lineStyle: { color: '#475569' } }, splitLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8' } },
          { type: 'value', gridIndex: 1, scale: true, axisLine: { lineStyle: { color: '#475569' } }, splitLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8' } }
        ],
        dataZoom: [
          { type: 'inside', xAxisIndex: [0, 1], start: 0, end: 100 },
          { type: 'slider', xAxisIndex: [0, 1], bottom: 40, height: 24, start: 0, end: 100, borderColor: '#334155', backgroundColor: '#0f172a', fillerColor: 'rgba(56,189,248,0.25)', textStyle: { color: '#94a3b8' } }
        ],
        series: [
          { name: 'CL', type: 'line', showSymbol: false, xAxisIndex: 0, yAxisIndex: 0, data: series.cl_close, lineStyle: { width: 2 } },
          { name: 'BRENTOIL', type: 'line', showSymbol: false, xAxisIndex: 0, yAxisIndex: 0, data: series.bren_close, lineStyle: { width: 2 } },
          { name: '绝对价差', type: 'line', showSymbol: false, xAxisIndex: 1, yAxisIndex: 1, data: series.spread_abs_bren_minus_cl, areaStyle: { color: 'rgba(34,197,94,0.18)' }, lineStyle: { width: 2 } }
        ]
      }, true);
    }

    document.getElementById('btn-hourly').addEventListener('click', () => loadData('hourly').catch(showError));
    document.getElementById('btn-daily').addEventListener('click', () => loadData('daily').catch(showError));
    window.addEventListener('resize', () => chart.resize());

    function showError(err) {
      document.getElementById('meta').textContent = '数据加载失败：' + err;
    }

    loadData('hourly').catch(showError);
  </script>
</body>
</html>
